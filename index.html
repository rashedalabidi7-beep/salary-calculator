<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة الراتب الذكية</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-color: #0a84ff;
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --input-bg: rgba(118, 118, 128, 0.24);
      --card-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(10, 132, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(94, 92, 230, 0.15) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 28px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-sub);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 17px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-color);
      background: rgba(118, 118, 128, 0.35);
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-calc {
      width: 100%;
      background: var(--accent-gradient);
      border: none;
      border-radius: 14px;
      padding: 16px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
      margin-top: 8px;
    }

    .btn-calc:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .results-container {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-card.highlight {
      background: rgba(10, 132, 255, 0.12);
      border-color: rgba(10, 132, 255, 0.3);
    }

    .result-info span {
      display: block;
    }

    .result-title {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .result-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
    }

    .result-value {
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
      direction: ltr;
    }

    .highlight .result-value {
      color: #30d158;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>حاسبة الراتب</h1>
      <p>احسب تفاصيل راتبك اليومي والشهر بسلاسة</p>
    </div>

    <div class="input-group">
      <label>الراتب الشهري الأولي</label>
      <div class="input-wrapper">
        <input type="number" id="monthlySalary" placeholder="أدخل الراتب الشامل" inputmode="decimal">
      </div>
    </div>

    <div class="grid-inputs">
      <div class="input-group">
        <label>أيام العمل/شهر</label>
        <div class="input-wrapper">
          <input type="number" id="workDays" value="30" inputmode="numeric">
        </div>
      </div>
      <div class="input-group">
        <label>ساعات العمل/يوم</label>
        <div class="input-wrapper">
          <input type="number" id="workHours" value="8" inputmode="numeric">
        </div>
      </div>
    </div>

    <button class="btn-calc" onclick="calculateSalary()">حساب التفاصيل</button>

    <div class="results-container">
      <div class="result-card highlight">
        <div class="result-info">
          <span class="result-title">الراتب الشهري الصافي</span>
          <span class="result-subtitle">إجمالي المستحق</span>
        </div>
        <span class="result-value" id="resMonthly">0.00</span>
      </div>

      <div class="result-card">
        <div class="result-info">
          <span class="result-title">معدل الراتب اليومي</span>
          <span class="result-subtitle">لكل يوم عمل</span>
        </div>
        <span class="result-value" id="resDaily">0.00</span>
      </div>

      <div class="result-card">
        <div class="result-info">
          <span class="result-title">أجر ساعة العمل</span>
          <span class="result-subtitle">لكل ساعة</span>
        </div>
        <span class="result-value" id="resHourly">0.00</span>
      </div>
    </div>
  </div>

  <script>
    function calculateSalary() {
      const salary = parseFloat(document.getElementById('monthlySalary').value) || 0;
      const days = parseFloat(document.getElementById('workDays').value) || 30;
      const hours = parseFloat(document.getElementById('workHours').value) || 8;

      const daily = days > 0 ? (salary / days) : 0;
      const hourly = (days > 0 && hours > 0) ? (daily / hours) : 0;

      document.getElementById('resMonthly').textContent = salary.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('resDaily').textContent = daily.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      document.getElementById('resHourly').textContent = hourly.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  </script>

</body>
</html>
