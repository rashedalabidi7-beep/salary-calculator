<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة الراتب الاحترافية - Firebase Pro</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-color: #0a84ff;
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --input-bg: rgba(118, 118, 128, 0.24);
      --danger-color: #ff453a;
      --success-color: #30d158;
      --card-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(10, 132, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(94, 92, 230, 0.15) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 28px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-sub);
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-color);
      background: rgba(118, 118, 128, 0.35);
    }

    .grid-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      width: 100%;
      background: var(--accent-gradient);
      border: none;
      border-radius: 14px;
      padding: 14px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
      margin-top: 8px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-container {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-card.highlight {
      background: rgba(10, 132, 255, 0.12);
      border-color: rgba(10, 132, 255, 0.3);
    }

    .result-title {
      font-size: 13px;
      color: var(--text-sub);
    }

    .result-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      direction: ltr;
    }

    .highlight .result-value {
      color: var(--success-color);
    }

    .history-section {
      margin-top: 28px;
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 15px;
      font-weight: 600;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>حاسبة الراتب الذكية</h1>
      <p>احتساب وتنسيق مستحقات الموظفين مع المزامنة السحابية</p>
    </div>

    <div class="input-group">
      <label>اسم الموظف أو المسمى الوظيفي</label>
      <div class="input-wrapper">
        <input type="text" id="employeeName" placeholder="أدخل الاسم">
      </div>
    </div>

    <div class="input-group">
      <label>الراتب الشهري الأساسي</label>
      <div class="input-wrapper">
        <input type="number" id="monthlySalary" placeholder="أدخل المبلغ الإجمالي" inputmode="decimal">
      </div>
    </div>

    <div class="grid-inputs">
      <div class="input-group">
        <label>أيام العمل / شهرياً</label>
        <div class="input-wrapper">
          <input type="number" id="workDays" value="30">
        </div>
      </div>
      <div class="input-group">
        <label>ساعات العمل / يومياً</label>
        <div class="input-wrapper">
          <input type="number" id="workHours" value="8">
        </div>
      </div>
    </div>

    <button class="btn-action" id="btnSave">احتساب وحفظ السجل</button>

    <div class="results-container">
      <div class="result-card highlight">
        <span class="result-title">الراتب الشهري الإجمالي</span>
        <span class="result-value" id="resMonthly">0.00</span>
      </div>
      <div class="result-card">
        <span class="result-title">معدل الاستحقاق اليومي</span>
        <span class="result-value" id="resDaily">0.00</span>
      </div>
      <div class="result-card">
        <span class="result-title">أجر الساعة الواحدة</span>
        <span class="result-value" id="resHourly">0.00</span>
      </div>
    </div>

    <div class="history-section">
      <div class="history-header">
        <span class="history-title">السجلات المحفوظة سحابياً</span>
      </div>
      <div class="history-list" id="historyList">
        <div style="color:var(--text-sub); font-size:12px; text-align:center; padding:10px;">جاري تحميل السجلات...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpK3xg0mWICrIpFqT-YOSuNySgd92y6lU",
      authDomain: "calculator-5d1e9.firebaseapp.com",
      projectId: "calculator-5d1e9",
      storageBucket: "calculator-5d1e9.firebasestorage.app",
      messagingSenderId: "206617069962",
      appId: "1:206617069962:web:55e13c111c6b25974e2073",
      measurementId: "G-NZ8MYQCT6V"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const salariesRef = collection(db, "salaries");

    const btnSave = document.getElementById('btnSave');

    btnSave.addEventListener('click', async () => {
      const name = document.getElementById('employeeName').value.trim() || 'موظف غير مسمى';
      const salary = parseFloat(document.getElementById('monthlySalary').value) || 0;
      const days = parseFloat(document.getElementById('workDays').value) || 30;
      const hours = parseFloat(document.getElementById('workHours').value) || 8;

      if (salary <= 0) {
        alert("يرجى إدخال مبلغ الراتب الشهري بشكل صحيح.");
        return;
      }

      const daily = days > 0 ? (salary / days) : 0;
      const hourly = (days > 0 && hours > 0) ? (daily / hours) : 0;

      document.getElementById('resMonthly').textContent = salary.toLocaleString('en-US', { minimumFractionDigits: 2 });
      document.getElementById('resDaily').textContent = daily.toLocaleString('en-US', { minimumFractionDigits: 2 });
      document.getElementById('resHourly').textContent = hourly.toLocaleString('en-US', { minimumFractionDigits: 2 });

      btnSave.disabled = true;
      btnSave.textContent = "جاري الحفظ...";

      try {
        await addDoc(salariesRef, {
          name,
          salary,
          daily,
          hourly,
          createdAt: serverTimestamp()
        });
        document.getElementById('employeeName').value = '';
        document.getElementById('monthlySalary').value = '';
      } catch (e) {
        console.error("خطأ أثناء الحفظ:", e);
        alert("تعذر الحفظ في قاعدة البيانات، تحقق من اتصالك بالنواحي التكميلية.");
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = "احتساب وحفظ السجل";
      }
    });

    const q = query(salariesRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('historyList');
      if (snapshot.empty) {
        container.innerHTML = '<div style="color:var(--text-sub); font-size:12px; text-align:center; padding:10px;">لا توجد سجلات محفوظة حالياً</div>';
        return;
      }

      container.innerHTML = '';
      snapshot.forEach((docItem) => {
        const item = docItem.data();
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <strong>${item.name}</strong><br>
            <small style="color:var(--text-sub)">الشهري: ${item.salary?.toLocaleString()} | اليومي: ${item.daily?.toFixed(2)}</small>
          </div>
          <button class="delete-btn" onclick="deleteRecord('${docItem.id}')">حذف</button>
        `;
        container.appendChild(div);
      });
    });

    window.deleteRecord = async (id) => {
      if (confirm("هل أنت تأكد من رغبتك في حذف هذا السجل؟")) {
        try {
          await deleteDoc(doc(db, "salaries", id));
        } catch (e) {
          console.error("خطأ أثناء الحذف:", e);
        }
      }
    };
  </script>
</body>
</html>
